<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e75b6">
        <animate attributeName="stop-color" values="#0e75b6;#7f5af0;#2cb67d;#0e75b6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7f5af0">
        <animate attributeName="stop-color" values="#7f5af0;#2cb67d;#0e75b6;#7f5af0" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2cb67d">
        <animate attributeName="stop-color" values="#2cb67d;#0e75b6;#7f5af0;#2cb67d" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="220"/></clipPath>
  </defs>

  <style>
    .title { font: 700 56px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; opacity: 0; animation: fadeUp 1.2s ease-out 0.2s forwards; }
    .sub   { font: 500 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e6f1ff; opacity: 0; animation: fadeUp 1.2s ease-out 0.8s forwards; }
    .w1 { animation: drift 10s linear infinite; }
    .w2 { animation: drift 14s linear infinite reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <!-- Two drifting waves (each path is 2000px wide so it loops seamlessly) -->
    <path class="w1" fill="#0d1117" fill-opacity="0.35"
      d="M0 170 Q125 140 250 170 T500 170 T750 170 T1000 170 T1250 170 T1500 170 T1750 170 T2000 170 V220 H0 Z"/>
    <path class="w2" fill="#0d1117" fill-opacity="0.6"
      d="M0 190 Q125 210 250 190 T500 190 T750 190 T1000 190 T1250 190 T1500 190 T1750 190 T2000 190 V220 H0 Z"/>
  </g>

  <text class="title" x="500" y="95" text-anchor="middle">Somesh Sharma</text>
  <text class="sub" x="500" y="135" text-anchor="middle">AI and Data Science  •  AI/ML Developer  •  Full-Stack Developer</text>
</svg>
